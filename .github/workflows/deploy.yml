name: Deploy to OCI Server

on:
  push:
    branches:
      - development

env:
  NODE_VERSION: '20.19.2'

jobs:
  # Development Branch Verification - runs first
  verify-development-branch:
    name: Verify Development Branch
    runs-on: ubuntu-latest
    steps:
    - name: Checkout development branch
      uses: actions/checkout@v4
      with:
        ref: development
        fetch-depth: 0

    - name: Verify branch content
      run: |
        echo "Verifying development branch..."

        CURRENT_BRANCH=$(git branch --show-current)
        if [ "$CURRENT_BRANCH" != "development" ]; then
          echo "Not on development branch! Current: $CURRENT_BRANCH"
          exit 1
        fi

        echo "Development branch verified"

  # Test job
  suite_webapp_test:
    name: Suite Webapp Service Validation
    runs-on: ubuntu-latest
    needs: [verify-development-branch]
    defaults:
      run:
        working-directory: ./

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: development

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install dependencies
      run: npm install --no-package-lock

    - name: Validate service
      run: echo "Service validation completed"

  # Build and Deploy
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [suite_webapp_test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: development

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install production dependencies
      run: |
        npm install --only=production --no-package-lock
        echo "Suite Webapp prepared for deployment"

    - name: Create deployment package
      run: |
        mkdir -p deployment/suite_webapp
        mkdir -p deployment/scripts

        # Copy all application files, excluding unnecessary items
        rsync -av --progress ./ deployment/suite_webapp/ \
          --exclude 'node_modules' \
          --exclude '.git' \
          --exclude '.github' \
          --exclude '.claude' \
          --exclude '.env' \
          --exclude '*.md' \
          --exclude '*.txt' \
          --exclude 'deployment' \
          --exclude 'docs'

        # Copy deployment scripts
        cp .github/scripts/deploy.sh deployment/scripts/
        cp .github/scripts/register-service.sh deployment/scripts/

    - name: Package deployment
      run: |
        tar -czf suite_webapp_deployment.tar.gz deployment/

    - name: Check required secrets
      run: |
        echo "Checking required secrets for deployment..."

        if [ -z "${{ secrets.OCI_SSH_KEY }}" ]; then
          echo "OCI_SSH_KEY secret is not configured"
          exit 1
        fi

        if [ -z "${{ secrets.OCI_HOST }}" ]; then
          echo "OCI_HOST secret is not configured"
          exit 1
        fi

        if [ -z "${{ secrets.OCI_USER }}" ]; then
          echo "OCI_USER secret is not configured"
          exit 1
        fi

        echo "All required secrets are configured"

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

    - name: Add OCI server to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts

    - name: Deploy to OCI server
      env:
        # Redis Configuration
        REDIS_URL: ${{ secrets.REDIS_URL }}
        REDIS_SERVER_IP: ${{ secrets.REDIS_SERVER_IP }}
        REDIS_SERVER_PORT: ${{ secrets.REDIS_SERVER_PORT }}
        REDIS_SESSION_SECRET_KEY: ${{ secrets.REDIS_SESSION_SECRET_KEY }}
      run: |
        # Transfer deployment package to server
        scp suite_webapp_deployment.tar.gz ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:/tmp/suite_webapp_deployment.tar.gz
        scp deployment/scripts/deploy.sh ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:/tmp/
        scp deployment/scripts/register-service.sh ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:/tmp/

        # Execute deployment with environment variables
        ssh ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }} "chmod +x /tmp/deploy.sh && chmod +x /tmp/register-service.sh && \
          REDIS_URL='$REDIS_URL' \
          REDIS_SERVER_IP='$REDIS_SERVER_IP' \
          REDIS_SERVER_PORT='$REDIS_SERVER_PORT' \
          /tmp/deploy.sh"

    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "Deployment to OCI completed successfully!"
        else
          echo "Deployment to OCI failed!"
        fi
