name: Deploy AwareMagnus (Next.js) to OCI Server

on:
  push:
    branches:
      - development
    paths:
      - 'awaremagnus/**'
      - '.github/workflows/deploy-awaremagnus.yml'
      - '.github/scripts/awaremagnus/**'

env:
  NODE_VERSION: '20.19.2'

jobs:
  # Development Branch Verification
  verify-development-branch:
    name: Verify Development Branch
    runs-on: ubuntu-latest
    steps:
    - name: Checkout development branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Verify branch content
      run: |
        echo "Verifying development branch deployment..."
        echo "Triggered by: ${{ github.ref }}"
        echo "Commit SHA: ${{ github.sha }}"

        if [ "${{ github.ref }}" != "refs/heads/development" ]; then
          echo "ERROR: Not triggered from development branch!"
          echo "Actual ref: ${{ github.ref }}"
          exit 1
        fi

        echo "Development branch verified - deploying commit ${{ github.sha }}"

  # Build and Test AwareMagnus
  awaremagnus-build-test:
    name: AwareMagnus Build & Test
    runs-on: ubuntu-latest
    needs: [verify-development-branch]
    defaults:
      run:
        working-directory: ./awaremagnus

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install dependencies
      run: npm install

    - name: Run linting
      run: npm run lint
      continue-on-error: true

    - name: Build Next.js application
      env:
        NEXT_PUBLIC_API_URL: ${{ secrets.AWAREMAGNUS_API_URL }}
        NEXT_PUBLIC_SERVICE_AWM_URL: ${{ secrets.NEXT_PUBLIC_SERVICE_AWM_URL }}
        NEXT_PUBLIC_SERVICE_SUITE_URL: ${{ secrets.NEXT_PUBLIC_SERVICE_SUITE_URL }}
      run: npm run build

    - name: Verify build output
      run: |
        if [ ! -d ".next/standalone" ]; then
          echo "ERROR: .next/standalone directory not found. Build may have failed."
          ls -la .next/ 2>/dev/null || echo ".next directory does not exist"
          exit 1
        fi
        echo "Build output verified - standalone directory exists"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: awaremagnus-build
        path: |
          awaremagnus/.next/standalone
          awaremagnus/.next/static
          awaremagnus/public
          awaremagnus/package.json
          awaremagnus/package-lock.json
          awaremagnus/next.config.js
        retention-days: 1

  # Deploy to OCI Server
  deploy-awaremagnus:
    name: Deploy AwareMagnus to OCI
    runs-on: ubuntu-latest
    needs: [awaremagnus-build-test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: awaremagnus-build
        path: .

    - name: Log deployment info
      run: |
        echo "=========================================="
        echo "Deploying AwareMagnus from: ${{ github.ref }}"
        echo "Commit SHA: ${{ github.sha }}"
        echo "Commit message: ${{ github.event.head_commit.message }}"
        echo "=========================================="

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Verify downloaded artifacts
      run: |
        echo "Listing downloaded artifact structure..."
        ls -la awaremagnus/.next/standalone/ || { echo "ERROR: standalone build not found in artifacts"; exit 1; }
        ls -la awaremagnus/.next/static/ || { echo "ERROR: static assets not found in artifacts"; exit 1; }

    - name: Create deployment package
      run: |
        mkdir -p deployment/awaremagnus
        mkdir -p deployment/scripts

        # Copy the standalone server (includes node_modules and server code)
        cp -r awaremagnus/.next/standalone/awaremagnus/* deployment/awaremagnus/

        # Copy static assets into the standalone .next directory
        mkdir -p deployment/awaremagnus/.next/static
        cp -r awaremagnus/.next/static/* deployment/awaremagnus/.next/static/

        # Copy public assets
        cp -r awaremagnus/public deployment/awaremagnus/

        # Copy deployment scripts
        cp .github/scripts/awaremagnus/deploy-awaremagnus.sh deployment/scripts/
        cp .github/scripts/awaremagnus/register-awaremagnus-service.sh deployment/scripts/
        cp .github/scripts/awaremagnus/create-awaremagnus-env.sh deployment/scripts/

    - name: Package deployment
      run: |
        tar -czf awaremagnus_deployment.tar.gz \
          --exclude 'node_modules' \
          --exclude '.git' \
          --exclude '.github' \
          --exclude '.claude' \
          --exclude '.env' \
          --exclude '*.md' \
          --exclude '*.txt' \
          --exclude 'deployment' \
          --exclude 'package-lock.json' \
          --exclude 'docs' \
          deployment/

    - name: Check required secrets
      run: |
        echo "Checking required secrets for deployment..."

        if [ -z "${{ secrets.OCI_SSH_KEY }}" ]; then
          echo "OCI_SSH_KEY secret is not configured"
          exit 1
        fi

        if [ -z "${{ secrets.OCI_HOST }}" ]; then
          echo "OCI_HOST secret is not configured"
          exit 1
        fi

        if [ -z "${{ secrets.OCI_USER }}" ]; then
          echo "OCI_USER secret is not configured"
          exit 1
        fi

        echo "All required secrets are configured"

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

    - name: Add OCI server to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts

    - name: Deploy to OCI server
      env:
        AWAREMAGNUS_API_URL: ${{ secrets.AWAREMAGNUS_API_URL }}
        AWAREMAGNUS_PORT: ${{ secrets.AWAREMAGNUS_PORT }}
        NEXT_PUBLIC_SERVICE_AWM_URL: ${{ secrets.NEXT_PUBLIC_SERVICE_AWM_URL }}
        NEXT_PUBLIC_SERVICE_SUITE_URL: ${{ secrets.NEXT_PUBLIC_SERVICE_SUITE_URL }}
      run: |
        # Transfer deployment package to server
        scp awaremagnus_deployment.tar.gz ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:/tmp/awaremagnus_deployment.tar.gz || { echo "Failed to copy deployment package"; exit 1; }
        scp deployment/scripts/deploy-awaremagnus.sh ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:/tmp/ || { echo "Failed to copy deploy-awaremagnus.sh"; exit 1; }
        scp deployment/scripts/register-awaremagnus-service.sh ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:/tmp/ || { echo "Failed to copy register-awaremagnus-service.sh"; exit 1; }
        scp deployment/scripts/create-awaremagnus-env.sh ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:/tmp/ || { echo "Failed to copy create-awaremagnus-env.sh"; exit 1; }

        # Verify files exist on remote server
        ssh ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }} "ls -la /tmp/deploy-awaremagnus.sh /tmp/register-awaremagnus-service.sh /tmp/create-awaremagnus-env.sh"

        # Execute deployment with environment variables
        ssh ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }} "chmod +x /tmp/deploy-awaremagnus.sh && chmod +x /tmp/register-awaremagnus-service.sh && chmod +x /tmp/create-awaremagnus-env.sh && \
          AWAREMAGNUS_API_URL='${AWAREMAGNUS_API_URL:-http://127.0.0.1:3001}' \
          AWAREMAGNUS_PORT='${AWAREMAGNUS_PORT:-8001}' \
          NEXT_PUBLIC_SERVICE_AWM_URL='${NEXT_PUBLIC_SERVICE_AWM_URL:-http://localhost:3002}' \
          NEXT_PUBLIC_SERVICE_SUITE_URL='${NEXT_PUBLIC_SERVICE_SUITE_URL:-http://localhost:3001}' \
          /tmp/deploy-awaremagnus.sh"

    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "AwareMagnus deployment to OCI completed successfully!"
        else
          echo "AwareMagnus deployment to OCI failed!"
        fi
